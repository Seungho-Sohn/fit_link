name: fit_link
description: FIT LINK — HTML 프로토타입을 Flutter로 이식한 앱
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  geolocator: ^14.1.2
  go_router: ^18.1.4
  google_fonts: ^6.2.1
  latlong2: ^0.10.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    # google_fonts가 네트워크 대신 쓰는 내장 글꼴 (파일명 규칙: Family-Weight.ttf)
    # NotoSerifKR은 KS X 1001 한글 2,350자 + 앱 문구에 쓰인 글자로 서브셋
    - assets/google_fonts/
  # 한글 글꼴 통일용 (SIL OFL 1.1 — assets/fonts/pretendard/OFL.txt)
  # theme.dart에서 모든 라틴 글꼴의 fontFamilyFallback으로 지정
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/pretendard/Pretendard-Light.otf
          weight: 300
        - asset: assets/fonts/pretendard/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/pretendard/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/pretendard/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/pretendard/Pretendard-Bold.otf
          weight: 700

# 앱 아이콘: 원본은 tool/icon/make_icon_test.dart 가 assets/icon/ 에 그린다.
#   flutter test tool/icon/make_icon_test.dart && dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  min_sdk_android: 24
  adaptive_icon_background: "#15140F"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#0A0A0B"
    theme_color: "#15140F"
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true
