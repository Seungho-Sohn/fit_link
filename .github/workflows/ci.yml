# push·PR마다 정적 분석, 테스트, 웹 빌드를 실행하고,
# master에 들어온 변경은 테스트를 통과한 경우에만 GitHub Pages로 배포한다.
#   https://seungho-sohn.github.io/fit_link/
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: # Actions 탭에서 수동 실행

# 같은 브랜치에 새로 push하면 이전 실행은 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9 # 개발 PC와 같은 버전
          channel: stable
          cache: true

      - run: flutter pub get

      - name: 정적 분석
        run: flutter analyze

      - name: 테스트
        run: flutter test

      # Pages 주소가 /fit_link/ 아래라서 base href를 맞춘다
      - name: 웹 빌드
        run: flutter build web --release --base-href /fit_link/

      - name: 배포용 결과물 올리기 (master만)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
