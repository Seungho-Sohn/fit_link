# push·PR마다 정적 분석, 테스트, 웹 빌드를 실행한다.
name: CI

on:
  push:
    branches: [master]
  pull_request:

# 같은 브랜치에 새로 push하면 이전 실행은 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9 # 개발 PC와 같은 버전
          channel: stable
          cache: true

      - run: flutter pub get

      - name: 정적 분석
        run: flutter analyze

      - name: 테스트
        run: flutter test

      - name: 웹 빌드
        run: flutter build web
